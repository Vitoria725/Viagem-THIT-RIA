name: Enviar alerta por e-mail

on:
  push:
    branches: [main]
    paths: ["outbox/alerta.enc.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save nodemailer@6.9.16
      - name: Decifrar e enviar
        env:
          ALERT_PRIVATE_KEY: ${{ secrets.ALERT_PRIVATE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node scripts/send-alert.mjs outbox/alerta.enc.json
