name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar só os arquivos públicos do site
        run: |
          mkdir -p _site/data _site/keys
          cp index.html setup.html _site/
          cp keys/*.json _site/keys/ 2>/dev/null || true
          cp data/*.enc.json _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
